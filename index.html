<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>さんすうラン</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fe0ff;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none !important}

#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button{pointer-events:auto}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
#question{flex:1;text-align:center;font-size:clamp(32px,6vw,56px);font-weight:900;color:#fff;text-shadow:0 3px 0 #ff7eb6,0 0 12px rgba(0,0,0,.25);margin-top:4px}
#progress{position:absolute;top:92px;left:0;right:0;text-align:center;color:#2a4d6b;font-weight:700;font-size:20px;text-shadow:0 1px 0 #fff}
.pill{background:#fff;border:0;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:700;color:#2a4d6b;box-shadow:0 3px 0 #9bb8cc}
#controls{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between}
.lane{width:110px;height:110px;border-radius:50%;border:0;background:rgba(255,255,255,.55);font-size:48px;color:#2a4d6b;box-shadow:0 5px 0 rgba(42,77,107,.35)}
#toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(255,255,255,.95);padding:14px 26px;border-radius:20px;font-size:clamp(22px,4vw,34px);font-weight:900;color:#ff5a8c;opacity:0;transition:.15s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25)}
.panel{background:#fff;border-radius:28px;padding:24px 28px;width:min(92vw,520px);max-height:90vh;overflow:auto;touch-action:pan-y;text-align:center;box-shadow:0 8px 0 #9bb8cc}
h1{margin:6px 0 16px;font-size:44px;color:#ff5a8c}
h2{color:#2a4d6b}
.big{display:block;width:100%;margin:12px 0;padding:18px;border:0;border-radius:20px;font-size:24px;font-weight:900;color:#fff;background:#ff7eb6;box-shadow:0 5px 0 #d6558f}
.big.alt{background:#5bc0eb;box-shadow:0 5px 0 #2e8fbf}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid .big{margin:0;font-size:28px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:2px dashed #e5eef5;font-size:22px}
.item .icon{font-size:36px;width:50px}
.item .name{flex:1;text-align:left;color:#2a4d6b;font-weight:700}
.small{padding:10px 18px;border:0;border-radius:14px;font-size:18px;font-weight:800;background:#ffd166;color:#5a3d00}
.small:disabled{background:#ddd;color:#999}
#rewardIcon{font-size:96px}
#rewardText{font-size:24px;white-space:pre-line;color:#2a4d6b;font-weight:700}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="ui" class="hidden">
  <div id="top">
    <button id="btnMenu" class="pill">≡ メニュー</button>
    <div id="question">?</div>
    <button id="btnBgm" class="pill">♪</button>
  </div>
  <div id="progress"></div>
  <div id="controls">
    <button class="lane" id="btnL">◀</button>
    <button class="lane" id="btnR">▶</button>
  </div>
  <div id="toast"></div>
</div>

<div id="menu" class="overlay hidden">
  <div class="panel" id="mainMenu">
    <h1>さんすうラン</h1>
    <button class="big" data-start="dan">かけ算（だんをえらぶ）</button>
    <button class="big" data-start="rand">かけ算ランダム</button>
    <button class="big" data-start="add">たし算・ひき算</button>
    <button class="big alt" id="btnWardrobe">きがえ 👗</button>
  </div>
  <div class="panel hidden" id="danMenu">
    <h2>どのだんをやる？</h2>
    <div class="grid" id="danGrid"></div>
    <button class="big alt" id="btnDanBack">もどる</button>
  </div>
  <div class="panel hidden" id="wardrobe">
    <h2>きがえ</h2>
    <div id="wardrobeList"></div>
    <button class="big alt" id="btnWardrobeBack">もどる</button>
  </div>
</div>

<div id="rewardOverlay" class="overlay hidden">
  <div class="panel">
    <div id="rewardIcon">🎁</div>
    <p id="rewardText"></p>
    <button class="big" id="btnRewardOk">やったー！</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
